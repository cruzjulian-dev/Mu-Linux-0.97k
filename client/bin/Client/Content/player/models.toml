# [models]    al arrancar (IDA OpenPlayers 0x00506170). El slot 390 es el cuerpo
#             (Player.bmd, sin número). Las velocidades de animación del jugador
#             siguen en el código (PlayerModels.cpp).
# [textures]  después (IDA OpenPlayerTextures 0x00507610), con los slots de
#             textura nuevos desde 310: las texturas de cada modelo y las de la
#             capa del Magic Gladiator (Robe01..03, slots 490..492). Las pieles
#             (texturas 301..307) siguen en el código.

