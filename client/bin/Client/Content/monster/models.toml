# Cómo se arma el modelo de cada tipo de monstruo (OpenMonsterModel). El número
# de la sección es el `resource` (o `extra`) de monster/spawn.toml: el modelo va
# al slot 270 + N y se lee de Data/Monster/Monster<N+1>.bmd.
#
# [default] vale para todos los tipos:
#   speed        velocidad de reproducción de las acciones 0, 1, 2...
#   loop         acciones que se repiten
#
# [model.N] lo completa; un tipo sin sección usa sólo [default]:
#   speed_scale  factor sobre la velocidad de las acciones 0..5
#   speed.A      velocidad de la acción A (se aplica después del factor)
#   loop.A       true: la acción A se repite
#   sounds       los cinco sonidos del modelo (paso x2, ataque x2, muerte),
#                contados desde el slot 170 de audio/sound/sounds.toml;
#                -1 = ninguno
#   bone_head    hueso de la cabeza (BMD::BoneHead)
#   stream_mesh  BMD::StreamMesh
#   other.M.X    el campo X (sounds, bone_head) del modelo M en vez del propio
#   texture.T    ["archivo", "filtro", "borde"]: textura extra en el slot T,
#                OpenJPG u OpenTGA según la extensión.  filtro: "nearest" o
#                "linear"; borde: "clamp" o "repeat"
#
# Los sonidos en sí están en [monster.N] de audio/sound/sounds.toml.

[default]
speed = [0.25, 0.2, 0.34, 0.33, 0.33, 0.5, 0.55]
loop = [6]

