# Modelos de los items y sus texturas, en el orden en que se cargan. El slot es
# el modelo: 400 + sección*32 + índice del item (ver ItemDefines.h).
#
# [models]    al arrancar (IDA OpenItems 0x005079D0):
#               slot = ["carpeta", "nombre", número]  ->  <carpeta><nombre><número>.bmd
#               con un cuarto valor "textures" carga además sus texturas
# [textures]  después de los modelos del personaje (IDA OpenItemTextures 0x00508D10):
#               slot = "carpeta" de las texturas del modelo
#
# Una textura que ya está cargada con el mismo nombre no se vuelve a cargar, así
# que el orden sólo decide qué slot de textura le toca a cada una.
# Los items agregados (índices desde 512) salen de item.toml del catálogo.

