# Texturas que se cargan en un momento fijo. Cada sección es un momento y sus
# texturas se cargan en el orden del archivo:
#
#   slot = ["archivo", filtro, borde]
#     archivo  ruta dentro de Data (o donde lo mande alias.toml); .tga se abre
#              con OpenTGA y el resto con OpenJPG
#     filtro   "nearest" o "linear"
#     borde    "clamp" o "repeat"
#
# Las texturas del terreno de cada mapa y las de la fuente siguen en el código
# (OpenWorld, OpenFont); las de cada mapa, en map/maps.toml.


